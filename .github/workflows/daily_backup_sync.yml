name: AirSense Pakistan Daily 24/7 Backup & Telegram Sync

on:
  schedule:
    # 19:01 UTC = 00:01 PKT everyday (zero-cost cron)
    - cron: '1 19 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Target date to backup (YYYY-MM-DD, defaults to yesterday in PKT)'
        required: false
        default: ''
      tier:
        description: 'Dataset tier to generate: 1, 2, 3, or all'
        required: false
        default: 'all'
      email_to:
        description: 'Optional recipient email address(es) override'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  daily-backup:
    name: Generate & Sync Daily 3-Tier Telemetry Backup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate 3-Tier CSVs & Deliver Telegram and Email Notifications
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ github.event.inputs.email_to || secrets.EMAIL_TO }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            unset DATABASE_URL
          fi
          CMD="python scripts/generate_daily_backup_csv.py"
          if [ -n "${{ github.event.inputs.date }}" ]; then
            CMD="$CMD --date ${{ github.event.inputs.date }}"
          fi
          if [ -n "${{ github.event.inputs.tier }}" ]; then
            CMD="$CMD --tier ${{ github.event.inputs.tier }}"
          fi
          if [ -n "${{ github.event.inputs.email_to }}" ]; then
            CMD="$CMD --email-to '${{ github.event.inputs.email_to }}'"
          fi
          echo "Executing: $CMD"
          $CMD

      - name: Upload 3-Tier Backup CSVs & Archives as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: airsense-3tier-daily-backups
          path: |
            data/backups/daily_csv/*.csv
            data/backups/daily_csv/*.zip
          if-no-files-found: warn
          retention-days: 90

      - name: Commit and Push Daily CSV Backup
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/backups/daily_csv/
          if git diff --staged --quiet; then
            echo "No new daily backup files to commit."
          else
            git commit -m "chore(backup): automated 24/7 3-tier telemetry snapshot [skip ci]"
            git push
          fi
