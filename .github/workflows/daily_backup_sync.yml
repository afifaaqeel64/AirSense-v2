name: AirSense Pakistan Daily 24/7 Backup & Telegram Sync

on:
  schedule:
    # 19:01 UTC = 00:01 PKT everyday (zero-cost cron)
    - cron: '1 19 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Target date to backup (YYYY-MM-DD, defaults to yesterday in PKT)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  daily-backup:
    name: Generate & Sync Daily Telemetry Backup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate Daily CSV & Deliver Telegram Notification
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            unset DATABASE_URL
          fi
          if [ -n "${{ github.event.inputs.date }}" ]; then
            python scripts/generate_daily_backup_csv.py --date "${{ github.event.inputs.date }}"
          else
            python scripts/generate_daily_backup_csv.py
          fi

      - name: Upload Daily Backup CSV as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: airsense-daily-csv-backups
          path: data/backups/daily_csv/*.csv
          if-no-files-found: warn
          retention-days: 90

      - name: Commit and Push Daily CSV Backup
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/backups/daily_csv/
          if git diff --staged --quiet; then
            echo "No new daily backup files to commit."
          else
            git commit -m "chore(backup): automated 24/7 daily telemetry snapshot [skip ci]"
            git push
          fi
