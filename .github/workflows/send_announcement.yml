name: AirSense Pakistan Send System Activation & Introduction Email

on:
  workflow_dispatch:
    inputs:
      email_to:
        description: 'Optional recipient email address(es) override (comma-separated, defaults to repository secret EMAIL_TO)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  send-intro-email:
    name: Dispatch Introduction Email to All Inboxes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Send System Activation Introduction Email
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ github.event.inputs.email_to || secrets.EMAIL_TO }}
        run: |
          ARGS=()
          if [ -n "${{ github.event.inputs.email_to }}" ]; then
            ARGS+=(--to "${{ github.event.inputs.email_to }}")
          fi
          python scripts/send_introduction_email.py "${ARGS[@]}"
